name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cue-and-nelua:
    runs-on: incus-spaceghost-theseus-init
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.17.1

      - name: Validate and compile CUE service model
        run: |
          set -eux
          cue version
          cue vet ./...
          mkdir -p build
          cue export ./services/postgresql.cue -e compiled --out text > build/services.tsc
          cue export ./tests/services.cue -e compiled --out text >> build/services.tsc
          test "$(head -n1 build/services.tsc | cut -f1)" = TSC6
          test "$(tail -n+2 build/services.tsc | cut -f1 | sort -u)" = TSC2
          test "$(wc -l < build/services.tsc)" -eq 5
          cue export ./qualificationfixtures -e compiled --out text > build/qualification.tsc
          cue export ./qualificationfixtures -e compiled --out text | cmp build/qualification.tsc -
          test "$(grep -c '^TSC7[[:space:]]' build/qualification.tsc)" -eq 1

      - name: Build pinned Nelua compiler
        run: |
          set -eux
          rm -rf /tmp/nelua-lang
          git init /tmp/nelua-lang
          git -C /tmp/nelua-lang remote add origin https://github.com/edubart/nelua-lang.git
          git -C /tmp/nelua-lang fetch --depth 1 origin 9ccf28de898a5e1615f1b04f5f28b3447aea0fb8
          git -C /tmp/nelua-lang checkout --detach FETCH_HEAD
          test "$(git -C /tmp/nelua-lang rev-parse HEAD)" = 9ccf28de898a5e1615f1b04f5f28b3447aea0fb8
          make -C /tmp/nelua-lang -j2
          /tmp/nelua-lang/nelua -h >/dev/null

      - name: Compile Theseus one-shot supervisor
        run: |
          set -eux
          /tmp/nelua-lang/nelua --compile-binary --release -o build/theseus src/theseus.nelua
          test -x build/theseus

      - name: Run core and grammar contracts
        run: |
          set -eux
          build/theseus --selftest
          ln -sf theseus build/the
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus status postgresql | tee build/status.txt
          grep -F 'PLANNED' build/status.txt
          grep -F 'unix-socket' build/status.txt
          grep -F /usr/bin/pg_isready build/status.txt
          build/the status of postgresql | grep -F 'PLANNED'
          test "$(build/the state of postgresql)" = PLANNED
          test "$(build/the restart-policy of postgresql)" = on-failure
          build/the services | grep -F 'postgresql'
          build/the failed services | grep -F '(none)'

      - name: Preserve empty and space-containing arguments from CUE
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus run argv-roundtrip >build/argv-roundtrip.txt
          grep -Fx 'first arg  last arg ' build/argv-roundtrip.txt

      - name: Refuse unsupported readiness before effects
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          if build/theseus run postgresql >build/postgresql-run.txt 2>&1; then
            echo 'postgresql unexpectedly spawned' >&2
            exit 1
          else
            rc=$?
          fi
          test "$rc" -eq 69
          grep -F 'refusing to spawn it' build/postgresql-run.txt
          ! grep -E '^spawn[[:space:]]+postgresql[[:space:]]' build/postgresql-run.txt

      - name: Supervise successful child with pidfd identity
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus run true-once | tee build/true-once.txt
          grep -E '^spawn[[:space:]]+true-once[[:space:]]+pid[[:space:]]+[0-9]+[[:space:]]+pidfd[[:space:]]+[0-9]+[[:space:]]+attempt[[:space:]]+1$' build/true-once.txt
          grep -E '^result[[:space:]]+true-once[[:space:]]+STOPPED[[:space:]]+attempts[[:space:]]+1[[:space:]]+restarts[[:space:]]+0[[:space:]]+exit[[:space:]]+0[[:space:]]+signal[[:space:]]+0$' build/true-once.txt

      - name: Apply bounded on-failure restart policy
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          if build/theseus run false-restart >build/false-restart.txt 2>&1; then
            echo 'false-restart unexpectedly succeeded' >&2
            exit 1
          else
            rc=$?
          fi
          test "$rc" -eq 1
          test "$(grep -Ec '^spawn[[:space:]]+false-restart[[:space:]]' build/false-restart.txt)" -eq 3
          test "$(grep -Ec '^restart[[:space:]]+false-restart[[:space:]]' build/false-restart.txt)" -eq 2
          grep -E '^result[[:space:]]+false-restart[[:space:]]+FAILED[[:space:]]+attempts[[:space:]]+3[[:space:]]+restarts[[:space:]]+2[[:space:]]+exit[[:space:]]+1[[:space:]]+signal[[:space:]]+0$' build/false-restart.txt

      - name: Stop a live child through its pidfd
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus run sleep-stop --stop-after-ms 25 | tee build/sleep-stop.txt
          grep -E '^transition[[:space:]]+sleep-stop[[:space:]]+STARTING[[:space:]]+READY$' build/sleep-stop.txt
          grep -E '^transition[[:space:]]+sleep-stop[[:space:]]+READY[[:space:]]+RUNNING$' build/sleep-stop.txt
          grep -E '^signal[[:space:]]+sleep-stop[[:space:]]+pidfd[[:space:]]+[0-9]+[[:space:]]+signal[[:space:]]+15$' build/sleep-stop.txt
          grep -E '^result[[:space:]]+sleep-stop[[:space:]]+STOPPED[[:space:]]+attempts[[:space:]]+1[[:space:]]+restarts[[:space:]]+0[[:space:]]+exit[[:space:]]+-1[[:space:]]+signal[[:space:]]+15$' build/sleep-stop.txt

      - name: Compile long-lived supervisor and live clients
        run: |
          set -eux
          mkdir -p build/live
          /tmp/nelua-lang/nelua --compile-binary --release -o build/live/theseusd src/supervisor.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/live/theseus src/live_client.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/live/control-test tests/live_control.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/alpine-openrc-test tests/alpine_openrc.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/alpine-qualification tests/alpine_qualification.nelua
          ln -sf theseus build/live/the
          test -x build/live/theseusd
          test -x build/live/theseus

      - name: Build the opt-in PID 1 entry point
        run: |
          set -eux
          /tmp/nelua-lang/nelua --compile-binary --release -o build/theseus-init src/init.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/pid1-test tests/pid1_guest.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/pid1-openrc-test tests/pid1_openrc_guest.nelua
          cue export ./pid1fixtures -e openrcCompiled --out text >build/pid1-openrc-graph.tsc
          cue export ./pid1fixtures -e openrcCompiled --out text | cmp build/pid1-openrc-graph.tsc -
          cue export ./pid1fixtures -e compiled --out text >build/pid1-graph.tsc
          cue export ./pid1fixtures -e compiled --out text | cmp build/pid1-graph.tsc -
          test "$(grep -c '^TSC3[[:space:]]' build/pid1-graph.tsc)" -eq 2
          test "$(tail -n1 build/pid1-graph.tsc | cut -f1-2)" = "$(printf 'TGT1\tdefault')"
          rc=0
          build/theseus-init >build/pid1-userspace.log 2>&1 || rc=$?
          test "$rc" -eq 64
          grep -Fx 'theseus-init requires Linux PID 1' build/pid1-userspace.log

      - name: Publish complete versioned bundles without replacing an installed release
        run: |
          set -eux
          /tmp/nelua-lang/nelua --compile-binary --release -o build/theseus-install src/install.nelua
          work="$(mktemp -d "$RUNNER_TEMP/release.XXXXXXXX")"
          mkdir "$work/releases" "$work/input"
          cp build/theseus-init build/live/theseusd build/live/theseus "$work/input/"
          cp build/pid1-graph.tsc "$work/input/graph.tsc"
          build/theseus-install "$work/releases" known "$work/input"
          cmp "$work/input/theseus-init" "$work/releases/known/theseus-init"
          cmp "$work/input/graph.tsc" "$work/releases/known/graph.tsc"
          test "$(readlink "$work/releases/known/the")" = theseus
          code=0
          build/theseus-install "$work/releases" known "$work/input" || code=$?
          test "$code" -eq 73
          cp "$work/input/graph.tsc" "$work/original.tsc"
          printf 'malformed\n' >"$work/input/graph.tsc"
          code=0
          build/theseus-install "$work/releases" broken "$work/input" || code=$?
          test "$code" -eq 65
          cmp "$work/original.tsc" "$work/releases/known/graph.tsc"
          cp "$work/original.tsc" "$work/input/graph.tsc"
          mv "$work/input/theseusd" "$work/worker"
          ln -s "$work/worker" "$work/input/theseusd"
          code=0
          build/theseus-install "$work/releases" unsafe "$work/input" || code=$?
          test "$code" -eq 74
          code=0
          build/theseus-install "$work/releases" ../escape "$work/input" || code=$?
          test "$code" -eq 64
          test "$(ls -A "$work/releases")" = known
          mkdir "$work/releases/reserved"
          mv "$work/worker" "$work/input/theseusd.real"
          rm "$work/input/theseusd"
          mv "$work/input/theseusd.real" "$work/input/theseusd"
          code=0
          build/theseus-install "$work/releases" reserved "$work/input" || code=$?
          test "$code" -eq 73
          test -z "$(ls -A "$work/releases/reserved")"


      - name: Keep OpenRC arguments explicit and the status grammar read-only
        run: |
          set -eux
          for path in build build/live; do
            code=0
            "$path/theseus" openrc --list status || code=$?
            test "$code" -eq 64
            code=0
            "$path/theseus" openrc postgresql --dry-run || code=$?
            test "$code" -eq 64
            code=0
            "$path/the" openrc postgresql stop || code=$?
            test "$code" -eq 64
            code=0
            "$path/theseus" openrc-runlevel --help || code=$?
            test "$code" -eq 64
            code=0
            "$path/theseus" openrc-runlevel shutdown || code=$?
            test "$code" -eq 64
            code=0
            "$path/the" openrc-runlevel default || code=$?
            test "$code" -eq 64
          done

      - name: Refuse a non-cgroup delegation before starting a service
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          export THESEUS_SOCKET="$RUNNER_TEMP/theseus-invalid-cgroup-$GITHUB_RUN_ID.sock"
          export THESEUS_CGROUP_ROOT="$PWD/build"
          test ! -e "$THESEUS_SOCKET"
          rc=0
          timeout 3s build/live/theseusd sleep-stop >build/live/invalid-cgroup.log 2>&1 || rc=$?
          test "$rc" -eq 83
          test ! -e "$THESEUS_SOCKET"
          grep -F 'invalid cgroup v2 delegation' build/live/invalid-cgroup.log
          ! grep -F 'daemon-spawn' build/live/invalid-cgroup.log

      - name: Require delegated ownership for crash recovery
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/reco.XXXXXXXX")"
          chmod 700 "$job_dir"
          export THESEUS_RECOVERY_DIR="$job_dir"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          unset THESEUS_CGROUP_ROOT
          rc=0
          build/live/theseusd sleep-stop >build/live/recovery-no-cgroup.txt 2>&1 || rc=$?
          test "$rc" -eq 64
          test -z "$(ls -A "$job_dir")"
          grep -F 'cannot claim recovery directory' build/live/recovery-no-cgroup.txt

      - name: Query live state and shut down without orphans
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          export THESEUS_SOCKET="$RUNNER_TEMP/theseus-$GITHUB_RUN_ID.sock"
          test ! -e "$THESEUS_SOCKET"
          build/live/theseusd sleep-stop >build/live/daemon.log 2>&1 &
          daemon_pid=$!
          cleanup() {
            if test -S "$THESEUS_SOCKET"; then
              timeout 3s build/live/theseus daemon-stop >/dev/null 2>&1 || true
            fi
            kill "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
            rm -f "$THESEUS_SOCKET"
          }
          trap cleanup EXIT
          i=0
          while ! test -S "$THESEUS_SOCKET"; do
            i=$((i + 1))
            test "$i" -lt 100
            sleep 0.02
          done
          test "$(stat -c '%a' "$THESEUS_SOCKET")" = 600
          for i in $(seq 1 100); do
            if test "$(timeout 2s build/live/the state of sleep-stop)" = RUNNING; then break; fi
            sleep 0.02
          done
          if ! build/live/the status of sleep-stop | tee build/live/status.txt; then
            cat build/live/daemon.log >&2
            exit 1
          fi
          grep -F 'RUNNING' build/live/status.txt
          child_pid=$(awk '$1 == "pid" {print $2}' build/live/status.txt)
          test -n "$child_pid"
          kill -0 "$child_pid"
          test "$(build/live/the state of sleep-stop)" = RUNNING
          timeout 8s build/live/control-test
          timeout 3s build/live/theseus daemon-stop
          wait "$daemon_pid"
          test ! -e "$THESEUS_SOCKET"
          if kill -0 "$child_pid" 2>/dev/null; then
            echo "owned child remained after daemon shutdown: $child_pid" >&2
            exit 1
          fi
          grep -E '^daemon-stopped[[:space:]]+sleep-stop$' build/live/daemon.log
          awk '$1 == "TE1" && $2 == "state" && $3 == "sleep-stop" && $4 == 1 {print $5, $6, $7}' \
            build/live/daemon.log >build/live/transitions.txt
          printf '%s\n' 'PLANNED STARTING start' 'STARTING READY pid-ready' \
            'READY RUNNING startup-complete' 'RUNNING STOPPING shutdown' \
            'STOPPING STOPPED shutdown-complete' | cmp - build/live/transitions.txt
          grep -Fx "$(printf 'TE1\tservice\tsleep-stop\t1\texited\t-1\t15')" build/live/daemon.log
          trap - EXIT

      - name: Handle SIGTERM and reap a SIGTERM-resistant child
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/theseus.XXXXXXXX")"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_RECORDS="$job_dir/services.tsc"
          printf 'TSC2\tstubborn\t%s\037ignore-term\037%s\talways\t10\tpid\n' \
            "$PWD/build/live/control-test" "$job_dir/ready" > "$THESEUS_RECORDS"
          build/live/theseusd stubborn >build/live/stubborn.log 2>&1 &
          daemon_pid=$!
          child_pid=
          cleanup() {
            kill "$daemon_pid" 2>/dev/null || true
            if test -n "$child_pid"; then kill -KILL "$child_pid" 2>/dev/null || true; fi
            wait "$daemon_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if test -f "$job_dir/ready"; then break; fi
            sleep 0.02
          done
          test -f "$job_dir/ready"
          timeout 3s build/live/the status of stubborn > "$job_dir/status"
          child_pid=$(awk '$1 == "pid" {print $2}' "$job_dir/status")
          test -n "$child_pid"
          kill -TERM "$daemon_pid"
          timeout 5s tail --pid="$daemon_pid" -f /dev/null
          wait "$daemon_pid"
          test ! -e "$THESEUS_SOCKET"
          ! kill -0 "$child_pid" 2>/dev/null
          test "$(grep -c '^daemon-spawn' build/live/stubborn.log)" -eq 1
          trap - EXIT
          rm -f "$job_dir/ready" "$job_dir/services.tsc" "$job_dir/status"
          rmdir "$job_dir"

      - name: Reap live daemon failures and enforce the restart budget
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          export THESEUS_SOCKET="$RUNNER_TEMP/theseus-restart-$GITHUB_RUN_ID.sock"
          test ! -e "$THESEUS_SOCKET"
          build/live/theseusd false-restart >build/live/restart.log 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -f build/live/restart.log && test "$(grep -c '^daemon-exit' build/live/restart.log || true)" -eq 3; then break; fi
            sleep 0.02
          done
          timeout 3s build/live/the status of false-restart >build/live/restart-status.txt
          awk '
            $1 == "state" && $2 == "FAILED" { state = 1 }
            $1 == "pid" && $2 == 0 { pid = 1 }
            $1 == "pidfd" && $2 == -1 { pidfd = 1 }
            $1 == "restarts" && $2 == 2 { restarts = 1 }
            $1 == "last-exit" && $2 == 1 { last = 1 }
            END { exit !(state && pid && pidfd && restarts && last) }
          ' build/live/restart-status.txt
          timeout 3s build/live/theseus daemon-stop
          wait "$daemon_pid"
          test "$(grep -c '^daemon-spawn' build/live/restart.log)" -eq 3
          test "$(grep -c '^daemon-exit' build/live/restart.log)" -eq 3
          test ! -e "$THESEUS_SOCKET"
          trap - EXIT

      - name: Wait for the owned socket and classify readiness failures
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/tsr.XXXXXXXX")"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_RECORDS="$job_dir/services.tsc"
          cue export ./tests/socket_readiness.cue -e readinessRecords --out text \
            -t "testDir=$job_dir" -t "testProgram=$PWD/build/live/control-test" > "$THESEUS_RECORDS"
          cmp "$THESEUS_RECORDS" <(cue export ./tests/socket_readiness.cue -e readinessRecords --out text \
            -t "testDir=$job_dir" -t "testProgram=$PWD/build/live/control-test")

          daemon_pid=
          foreign_pid=
          cleanup() {
            for pid in "$daemon_pid" "$foreign_pid"; do
              if test -n "$pid"; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          wait_state() {
            for i in $(seq 1 150); do
              if test -S "$THESEUS_SOCKET" &&
                 test "$(timeout 2s build/live/the state of "$1")" = "$2"; then return 0; fi
              sleep 0.02
            done
            return 1
          }

          stop_daemon() {
            timeout 3s build/live/theseus daemon-stop
            wait "$daemon_pid"
            daemon_pid=
            test ! -e "$THESEUS_SOCKET"
          }

          build/live/theseusd socket-ready >build/live/ready.log 2>&1 &
          daemon_pid=$!
          wait_state socket-ready STARTING
          test ! -e "$job_dir/service.sock"
          touch "$job_dir/gate"
          wait_state socket-ready RUNNING
          grep -Fx "$(printf 'TE1\treadiness\tsocket-ready\t1\tready')" build/live/ready.log
          stop_daemon
          rm "$job_dir/service.sock"

          build/live/control-test listen "$job_dir/service.sock" &
          foreign_pid=$!
          for i in $(seq 1 100); do
            if test -S "$job_dir/service.sock"; then break; fi
            sleep 0.02
          done
          test -S "$job_dir/service.sock"
          build/live/theseusd socket-timeout >build/live/ready-timeout.log 2>&1 &
          daemon_pid=$!
          wait_state socket-timeout STOPPING
          test -f "$job_dir/child-started"
          wait_state socket-timeout FAILED
          test "$(grep -c '^daemon-exit' build/live/ready-timeout.log)" -eq 2
          grep -Fx "$(printf 'TE1\treadiness\tsocket-timeout\t2\ttimeout')" build/live/ready-timeout.log
          ! grep -E '[[:space:]]ready$' build/live/ready-timeout.log
          kill -0 "$foreign_pid"
          test ! -e "$job_dir/foreign-probe.pid"
          stop_daemon

          build/live/theseusd socket-early-exit >build/live/early-exit.log 2>&1 &
          daemon_pid=$!
          wait_state socket-early-exit FAILED
          grep -Fx "$(printf 'TE1\treadiness\tsocket-early-exit\t1\texited-before-ready')" build/live/early-exit.log
          stop_daemon

          kill "$foreign_pid"
          wait "$foreign_pid" || true
          foreign_pid=
          test -S "$job_dir/service.sock"
          rm "$job_dir/service.sock" "$job_dir/services.tsc" "$job_dir/gate" "$job_dir/child-started"
          rmdir "$job_dir"
          trap - EXIT

      - name: Execute native targets with readiness, rollback, and reverse shutdown
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/tst.XXXXXXXX")"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_GRAPH="$job_dir/graph.tsc"
          cue export ./targetfixtures -e compiled --out text -t "testDir=$job_dir" \
            -t "testProgram=$PWD/build/live/control-test" > "$THESEUS_GRAPH"
          daemon_pid=
          cleanup() {
            if test -n "$daemon_pid"; then
              kill "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          wait_state() {
            for i in $(seq 1 150); do
              if test -S "$THESEUS_SOCKET" &&
                 test "$(timeout 2s build/live/the state of "$1")" = "$2"; then return 0; fi
              sleep 0.02
            done
            return 1
          }

          check_reaped() {
            test ! -e "$THESEUS_SOCKET"
            spawned="$(awk '$1 == "daemon-spawn" {print $4}' "$1")"
            test -n "$spawned"
            for pid in $spawned; do test ! -e "/proc/$pid"; done
          }

          build/live/theseusd --target demo >build/live/target-demo.log 2>&1 &
          daemon_pid=$!
          wait_state gate STARTING
          test "$(timeout 2s build/live/the state of app)" = PLANNED
          printf 'gate\tSTARTING\noptional\tPLANNED\nskipped\tPLANNED\napp\tPLANNED\n' >"$job_dir/list.expected"
          timeout 2s build/live/the services | cmp "$job_dir/list.expected" -
          timeout 2s build/live/the failed services >"$job_dir/list.failed"
          test ! -s "$job_dir/list.failed"
          touch "$job_dir/release"
          for i in $(seq 1 150); do
            if grep -Fq 'probe-failed' build/live/target-demo.log; then break; fi
            sleep 0.02
          done
          grep -F 'probe-failed' build/live/target-demo.log
          test -S "$job_dir/gate.sock"
          test "$(timeout 2s build/live/the state of gate)" = STARTING
          test "$(timeout 2s build/live/the state of app)" = PLANNED
          touch "$job_dir/probe-release"
          wait_state app RUNNING
          test "$(timeout 2s build/live/the state of skipped)" = FAILED
          printf 'gate\tRUNNING\noptional\tFAILED\nskipped\tFAILED\napp\tRUNNING\n' >"$job_dir/list.expected"
          timeout 2s build/live/theseus services | cmp "$job_dir/list.expected" -
          timeout 2s build/live/the running services >"$job_dir/list.running"
          printf 'gate\tRUNNING\napp\tRUNNING\n' | cmp "$job_dir/list.running" -
          timeout 2s build/live/the failed services >"$job_dir/list.failed"
          printf 'optional\tFAILED\nskipped\tFAILED\n' | cmp "$job_dir/list.failed" -
          timeout 8s build/live/theseus daemon-stop
          wait "$daemon_pid"
          daemon_pid=
          grep -Fx "$(printf 'TE1\ttarget\tdemo\trunning')" build/live/target-demo.log
          awk '$1 == "TE1" && $2 == "target" && $4 == "stopping" {print $5}' \
            build/live/target-demo.log > "$job_dir/stop-order"
          printf 'app\ngate\n' | cmp - "$job_dir/stop-order"
          ! grep -F "$(printf 'daemon-spawn\tskipped\t')" build/live/target-demo.log
          check_reaped build/live/target-demo.log

          rm "$job_dir/gate.sock"
          build/live/theseusd --target demo >build/live/target-lost.log 2>&1 &
          daemon_pid=$!
          wait_state app RUNNING
          gate_pid="$(timeout 2s build/live/the status of gate | awk '$1 == "pid" {print $2}')"
          test "$gate_pid" -gt 0
          kill -TERM "$gate_pid"
          timeout 8s tail --pid="$daemon_pid" -f /dev/null
          rc=0
          wait "$daemon_pid" || rc=$?
          daemon_pid=
          test "$rc" -eq 82
          grep -Fx "$(printf 'TE1\ttarget\tdemo\tfailed\tgate')" build/live/target-lost.log
          check_reaped build/live/target-lost.log

          build/live/theseusd --target rollback >build/live/target-rollback.log 2>&1 &
          daemon_pid=$!
          timeout 8s tail --pid="$daemon_pid" -f /dev/null
          rc=0
          wait "$daemon_pid" || rc=$?
          daemon_pid=
          test "$rc" -eq 82
          grep -Fx "$(printf 'TE1\ttarget\trollback\tfailed\tbad')" build/live/target-rollback.log
          ! grep -F "$(printf 'daemon-spawn\tunstarted\t')" build/live/target-rollback.log
          check_reaped build/live/target-rollback.log

          rc=0
          timeout 8s build/live/theseusd --target bad-exec >build/live/target-exec.log 2>&1 || rc=$?
          test "$rc" -eq 82
          grep -Fx "$(printf 'TE1\tservice\texec-failure\t1\texec-failed')" build/live/target-exec.log
          ! grep -F "$(printf 'daemon-spawn\texec-dependent\t')" build/live/target-exec.log
          check_reaped build/live/target-exec.log

          export THESEUS_GRAPH="$PWD/build/invalid-target.tsc"
          printf 'TSC3\tself\t/bin/true\tnever\t0\tnone\tself\t\t\t\nTGT1\tloop\tself\n' > "$THESEUS_GRAPH"
          rc=0
          timeout 2s build/live/theseusd --target loop >build/live/target-invalid.log 2>&1 || rc=$?
          test "$rc" -eq 67
          test ! -e "$THESEUS_SOCKET"
          ! grep -F 'daemon-spawn' build/live/target-invalid.log

          export THESEUS_GRAPH="$job_dir/full-target.tsc"
          names=
          : >"$THESEUS_GRAPH"
          : >"$job_dir/full-list.expected"
          for i in $(seq 1 32); do
            name="$(printf 'service-%055d' "$i")"
            printf 'TSC3\t%s\t/bin/sleep\03730\tnever\t0\tnone\t\t\t\t\n' "$name" >>"$THESEUS_GRAPH"
            printf '%s\tRUNNING\n' "$name" >>"$job_dir/full-list.expected"
            names="${names:+$names,}$name"
          done
          printf 'TGT1\tfull\t%s\n' "$names" >>"$THESEUS_GRAPH"
          build/live/theseusd --target full >build/live/target-full.log 2>&1 &
          daemon_pid=$!
          wait_state "$name" RUNNING
          timeout 2s build/live/the services | cmp "$job_dir/full-list.expected" -
          timeout 8s build/live/theseus daemon-stop
          wait "$daemon_pid"
          daemon_pid=
          check_reaped build/live/target-full.log
          trap - EXIT

      - name: Cancel and reap hung application readiness probes
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/prb.XXXXXXXX")"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_RECORDS="$job_dir/services.tsc"
          cue export ./tests/socket_readiness.cue -e probeTimeoutRecord --out text \
            -t "testDir=$job_dir" -t "testProgram=$PWD/build/live/control-test" > "$THESEUS_RECORDS"
          build/live/theseusd probe-timeout >build/live/probe-timeout.log 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 150); do
            if test -S "$THESEUS_SOCKET" &&
               test "$(timeout 2s build/live/the state of probe-timeout)" = FAILED; then break; fi
            sleep 0.02
          done
          test "$(timeout 2s build/live/the state of probe-timeout)" = FAILED
          grep -F "$(printf 'TE1\treadiness\tprobe-timeout\t1\tprobe-timeout')" build/live/probe-timeout.log
          grep -F "$(printf 'TE1\treadiness\tprobe-timeout\t1\ttimeout')" build/live/probe-timeout.log
          leader_pid="$(awk '$1 == "daemon-spawn" {print $4}' build/live/probe-timeout.log)"
          test "$leader_pid" -gt 0 && test ! -e "/proc/$leader_pid"
          test "$(wc -w < "/proc/$daemon_pid/task/$daemon_pid/children")" -eq 1
          probe_pid="$(cat "$job_dir/slow-probe.pid")"
          test "$probe_pid" -gt 0 && test ! -e "/proc/$probe_pid"
          timeout 4s build/live/theseus daemon-stop
          wait "$daemon_pid"
          test ! -e "$THESEUS_SOCKET"
          trap - EXIT

      - name: Reap adopted descendants while their service stays running
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/orp.XXXXXXXX")"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_RECORDS="$job_dir/services.tsc"
          unset THESEUS_CGROUP_ROOT
          printf 'TSC2\torphans\t%s\037orphan-burst\037%s\tnever\t0\tnone\n' \
            "$PWD/build/live/control-test" "$job_dir" > "$THESEUS_RECORDS"
          build/live/theseusd orphans >build/live/orphans.log 2>&1 &
          daemon_pid=$!
          trap 'touch "$job_dir/exit"; kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -f "$job_dir/adopted"; then break; fi
            kill -0 "$daemon_pid"
            sleep 0.02
          done
          test -f "$job_dir/adopted"
          test "$(wc -l < "$job_dir/pids")" -eq 80
          for pid in $(cat "$job_dir/pids"); do
            test "$(awk '$1 == "PPid:" {print $2}' "/proc/$pid/status")" -eq "$daemon_pid"
          done
          test "$(timeout 2s build/live/the state of orphans)" = RUNNING
          touch "$job_dir/exit"
          for i in $(seq 1 150); do
            if test "$(grep -c 'adopted-exit' build/live/orphans.log || true)" -eq 80; then break; fi
            sleep 0.02
          done
          awk '$1 == "TE1" && $2 == "process" && $4 == "adopted-exit" && $5 == 17 && $6 == 0 {print $3}' \
            build/live/orphans.log | sort -n > "$job_dir/reaped"
          sort -n "$job_dir/pids" | cmp - "$job_dir/reaped"
          for pid in $(cat "$job_dir/pids"); do test ! -e "/proc/$pid"; done
          test "$(timeout 2s build/live/the state of orphans)" = RUNNING
          timeout 4s build/live/theseus daemon-stop
          wait "$daemon_pid"
          test ! -e "$THESEUS_SOCKET"
          trap - EXIT

      - name: Keep supervision responsive with stalled and closed log collectors
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/log.XXXXXXXX")"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_RECORDS="$job_dir/services.tsc"
          printf 'TSC2\tchurn\t%s\037log-churn\037%s\tnever\t0\tnone\n' \
            "$PWD/build/live/control-test" "$job_dir/complete" > "$THESEUS_RECORDS"
          mkfifo "$job_dir/log.pipe"
          exec 4<>"$job_dir/log.pipe"
          # Fill the collector pipe before Theseus can write its first record.
          dd if=/dev/zero oflag=nonblock bs=4096 count=512 status=none >&4 2>/dev/null || true
          build/live/theseusd churn 4>&- >"$job_dir/log.pipe" 2>&1 &
          daemon_pid=$!
          collector=
          trap 'exec 4>&-; kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true; if test -n "$collector"; then kill "$collector" 2>/dev/null || true; fi' EXIT
          for i in $(seq 1 180); do
            if test -f "$job_dir/complete"; then break; fi
            kill -0 "$daemon_pid"
            sleep 0.02
          done
          test -f "$job_dir/complete"
          test "$(timeout 2s build/live/the state of churn)" = RUNNING
          leader="$(timeout 2s build/live/the status of churn | awk '$1 == "pid" {print $2}')"
          test "$leader" -gt 0
          (
            exec 4>&-
            exec 5<"$job_dir/log.pipe"
            touch "$job_dir/collector-open"
            exec cat <&5
          ) >"$job_dir/recovered.log" &
          collector=$!
          for i in $(seq 1 100); do
            if test -f "$job_dir/collector-open"; then break; fi
            sleep 0.02
          done
          test -f "$job_dir/collector-open"
          exec 4>&-
          for i in $(seq 1 150); do
            if grep -aEq 'TE1[[:space:]]+log[[:space:]]+dropped[[:space:]]+[1-9]' "$job_dir/recovered.log"; then break; fi
            sleep 0.02
          done
          grep -aE 'TE1[[:space:]]+log[[:space:]]+dropped[[:space:]]+[1-9]' "$job_dir/recovered.log"
          kill "$collector"
          wait "$collector" || true
          collector=
          test "$(timeout 2s build/live/the state of churn)" = RUNNING
          timeout 3s build/live/theseus daemon-stop
          timeout 3s tail --pid="$daemon_pid" -f /dev/null
          wait "$daemon_pid"
          test ! -e "/proc/$leader"
          test ! -e "$THESEUS_SOCKET"
          trap - EXIT

          mkfifo "$job_dir/stall.pipe"
          exec 4<>"$job_dir/stall.pipe"
          dd if=/dev/zero oflag=nonblock bs=4096 count=512 status=none >&4 2>/dev/null || true
          rm "$job_dir/complete"
          export THESEUS_GRAPH="$job_dir/graph.tsc"
          {
            printf 'TSC3\tchurn\t%s\037log-churn\037%s\tnever\t0\tnone\t\t\t\t\n' \
              "$PWD/build/live/control-test" "$job_dir/complete"
            printf 'TSC3\tflap\t/bin/false\ton-failure\t8\tnone\t\t\tchurn\t\n'
            printf 'TSC3\tanchor\t/bin/sleep\03730\tnever\t0\tnone\tchurn\tflap\t\t\n'
            printf 'TGT1\tstall\tanchor\n'
          } >"$THESEUS_GRAPH"
          build/live/theseusd --target stall 4>&- >"$job_dir/stall.pipe" 2>&1 &
          daemon_pid=$!
          trap 'exec 4>&-; kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 180); do
            if test -f "$job_dir/complete"; then break; fi
            kill -0 "$daemon_pid"
            sleep 0.02
          done
          test -f "$job_dir/complete"
          for i in $(seq 1 150); do
            if test "$(timeout 2s build/live/the state of flap)" = FAILED; then break; fi
            sleep 0.02
          done
          timeout 2s build/live/the status of flap >"$job_dir/flap.status"
          awk '$1 == "state" && $2 == "FAILED" { failed=1 }
               $1 == "restarts" && $2 == 8 { retried=1 }
               END { exit !(failed && retried) }' "$job_dir/flap.status"
          logger=
          for pid in $(cat "/proc/$daemon_pid/task/$daemon_pid/children"); do
            if test "$(readlink "/proc/$pid/exe" || true)" = "$PWD/build/live/theseusd"; then
              logger=$pid
              break
            fi
          done
          test -n "$logger"
          timeout 3s build/live/theseus daemon-stop
          timeout 3s tail --pid="$daemon_pid" -f /dev/null
          wait "$daemon_pid"
          test ! -e "/proc/$logger"
          test ! -e "$THESEUS_SOCKET"
          rc=0
          THESEUS_GRAPH="$job_dir/absent.tsc" timeout 2s build/live/theseusd --target missing \
            4>&- >"$job_dir/stall.pipe" 2>&1 || rc=$?
          test "$rc" -eq 65
          test ! -e "$THESEUS_SOCKET"
          exec 4>&-
          trap - EXIT
