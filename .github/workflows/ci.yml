name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cue-and-nelua:
    runs-on: incus-spaceghost-theseus-init
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.17.1

      - name: Validate and compile CUE service model
        run: |
          set -eux
          cue version
          cue vet ./...
          mkdir -p build
          cue export ./services/postgresql.cue -e compiled --out text > build/services.tsc
          cue export ./tests/services.cue -e compiled --out text >> build/services.tsc
          test "$(head -n1 build/services.tsc | cut -f1)" = TSC4
          test "$(tail -n+2 build/services.tsc | cut -f1 | sort -u)" = TSC2
          test "$(wc -l < build/services.tsc)" -eq 5

      - name: Build pinned Nelua compiler
        run: |
          set -eux
          rm -rf /tmp/nelua-lang
          git init /tmp/nelua-lang
          git -C /tmp/nelua-lang remote add origin https://github.com/edubart/nelua-lang.git
          git -C /tmp/nelua-lang fetch --depth 1 origin 9ccf28de898a5e1615f1b04f5f28b3447aea0fb8
          git -C /tmp/nelua-lang checkout --detach FETCH_HEAD
          test "$(git -C /tmp/nelua-lang rev-parse HEAD)" = 9ccf28de898a5e1615f1b04f5f28b3447aea0fb8
          make -C /tmp/nelua-lang -j2
          /tmp/nelua-lang/nelua -h >/dev/null

      - name: Compile Theseus one-shot supervisor
        run: |
          set -eux
          /tmp/nelua-lang/nelua --compile-binary --release -o build/theseus src/theseus.nelua
          test -x build/theseus

      - name: Run core and grammar contracts
        run: |
          set -eux
          build/theseus --selftest
          ln -sf theseus build/the
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus status postgresql | tee build/status.txt
          grep -F 'PLANNED' build/status.txt
          grep -F 'unix-socket' build/status.txt
          build/the status of postgresql | grep -F 'PLANNED'
          test "$(build/the state of postgresql)" = PLANNED
          test "$(build/the restart-policy of postgresql)" = on-failure
          build/the services | grep -F 'postgresql'
          build/the failed services | grep -F '(none)'

      - name: Preserve empty and space-containing arguments from CUE
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus run argv-roundtrip >build/argv-roundtrip.txt
          grep -Fx 'first arg  last arg ' build/argv-roundtrip.txt

      - name: Refuse unsupported readiness before effects
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          if build/theseus run postgresql >build/postgresql-run.txt 2>&1; then
            echo 'postgresql unexpectedly spawned' >&2
            exit 1
          else
            rc=$?
          fi
          test "$rc" -eq 69
          grep -F 'refusing to spawn it' build/postgresql-run.txt
          ! grep -E '^spawn[[:space:]]+postgresql[[:space:]]' build/postgresql-run.txt

      - name: Supervise successful child with pidfd identity
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus run true-once | tee build/true-once.txt
          grep -E '^spawn[[:space:]]+true-once[[:space:]]+pid[[:space:]]+[0-9]+[[:space:]]+pidfd[[:space:]]+[0-9]+[[:space:]]+attempt[[:space:]]+1$' build/true-once.txt
          grep -E '^result[[:space:]]+true-once[[:space:]]+STOPPED[[:space:]]+attempts[[:space:]]+1[[:space:]]+restarts[[:space:]]+0[[:space:]]+exit[[:space:]]+0[[:space:]]+signal[[:space:]]+0$' build/true-once.txt

      - name: Apply bounded on-failure restart policy
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          if build/theseus run false-restart >build/false-restart.txt 2>&1; then
            echo 'false-restart unexpectedly succeeded' >&2
            exit 1
          else
            rc=$?
          fi
          test "$rc" -eq 1
          test "$(grep -Ec '^spawn[[:space:]]+false-restart[[:space:]]' build/false-restart.txt)" -eq 3
          test "$(grep -Ec '^restart[[:space:]]+false-restart[[:space:]]' build/false-restart.txt)" -eq 2
          grep -E '^result[[:space:]]+false-restart[[:space:]]+FAILED[[:space:]]+attempts[[:space:]]+3[[:space:]]+restarts[[:space:]]+2[[:space:]]+exit[[:space:]]+1[[:space:]]+signal[[:space:]]+0$' build/false-restart.txt

      - name: Stop a live child through its pidfd
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus run sleep-stop --stop-after-ms 25 | tee build/sleep-stop.txt
          grep -E '^transition[[:space:]]+sleep-stop[[:space:]]+STARTING[[:space:]]+READY$' build/sleep-stop.txt
          grep -E '^transition[[:space:]]+sleep-stop[[:space:]]+READY[[:space:]]+RUNNING$' build/sleep-stop.txt
          grep -E '^signal[[:space:]]+sleep-stop[[:space:]]+pidfd[[:space:]]+[0-9]+[[:space:]]+signal[[:space:]]+15$' build/sleep-stop.txt
          grep -E '^result[[:space:]]+sleep-stop[[:space:]]+STOPPED[[:space:]]+attempts[[:space:]]+1[[:space:]]+restarts[[:space:]]+0[[:space:]]+exit[[:space:]]+-1[[:space:]]+signal[[:space:]]+15$' build/sleep-stop.txt

      - name: Compile long-lived supervisor and live clients
        run: |
          set -eux
          mkdir -p build/live
          /tmp/nelua-lang/nelua --compile-binary --release -o build/live/theseusd src/supervisor.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/live/theseus src/live_client.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/live/control-test tests/live_control.nelua
          ln -sf theseus build/live/the
          test -x build/live/theseusd
          test -x build/live/theseus

      - name: Query live state and shut down without orphans
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          export THESEUS_SOCKET="$RUNNER_TEMP/theseus-$GITHUB_RUN_ID.sock"
          test ! -e "$THESEUS_SOCKET"
          build/live/theseusd sleep-stop >build/live/daemon.log 2>&1 &
          daemon_pid=$!
          cleanup() {
            if test -S "$THESEUS_SOCKET"; then
              timeout 3s build/live/theseus daemon-stop >/dev/null 2>&1 || true
            fi
            kill "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
            rm -f "$THESEUS_SOCKET"
          }
          trap cleanup EXIT
          i=0
          while ! test -S "$THESEUS_SOCKET"; do
            i=$((i + 1))
            test "$i" -lt 100
            sleep 0.02
          done
          test "$(stat -c '%a' "$THESEUS_SOCKET")" = 600
          if ! build/live/the status of sleep-stop | tee build/live/status.txt; then
            cat build/live/daemon.log >&2
            exit 1
          fi
          grep -F 'RUNNING' build/live/status.txt
          child_pid=$(awk '$1 == "pid" {print $2}' build/live/status.txt)
          test -n "$child_pid"
          kill -0 "$child_pid"
          test "$(build/live/the state of sleep-stop)" = RUNNING
          timeout 8s build/live/control-test
          timeout 3s build/live/theseus daemon-stop
          wait "$daemon_pid"
          test ! -e "$THESEUS_SOCKET"
          if kill -0 "$child_pid" 2>/dev/null; then
            echo "owned child remained after daemon shutdown: $child_pid" >&2
            exit 1
          fi
          grep -E '^daemon-stopped[[:space:]]+sleep-stop$' build/live/daemon.log
          trap - EXIT

      - name: Handle SIGTERM and reap a SIGTERM-resistant child
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/theseus.XXXXXXXX")"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_RECORDS="$job_dir/services.tsc"
          printf 'TSC2\tstubborn\t%s\037ignore-term\037%s\talways\t10\tpid\n' \
            "$PWD/build/live/control-test" "$job_dir/ready" > "$THESEUS_RECORDS"
          build/live/theseusd stubborn >build/live/stubborn.log 2>&1 &
          daemon_pid=$!
          child_pid=
          cleanup() {
            kill "$daemon_pid" 2>/dev/null || true
            if test -n "$child_pid"; then kill -KILL "$child_pid" 2>/dev/null || true; fi
            wait "$daemon_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if test -f "$job_dir/ready"; then break; fi
            sleep 0.02
          done
          test -f "$job_dir/ready"
          timeout 3s build/live/the status of stubborn > "$job_dir/status"
          child_pid=$(awk '$1 == "pid" {print $2}' "$job_dir/status")
          test -n "$child_pid"
          kill -TERM "$daemon_pid"
          timeout 5s tail --pid="$daemon_pid" -f /dev/null
          wait "$daemon_pid"
          test ! -e "$THESEUS_SOCKET"
          ! kill -0 "$child_pid" 2>/dev/null
          test "$(grep -c '^daemon-spawn' build/live/stubborn.log)" -eq 1
          trap - EXIT
          rm -f "$job_dir/ready" "$job_dir/services.tsc" "$job_dir/status"
          rmdir "$job_dir"

      - name: Reap live daemon failures and enforce the restart budget
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          export THESEUS_SOCKET="$RUNNER_TEMP/theseus-restart-$GITHUB_RUN_ID.sock"
          test ! -e "$THESEUS_SOCKET"
          build/live/theseusd false-restart >build/live/restart.log 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -f build/live/restart.log && test "$(grep -c '^daemon-exit' build/live/restart.log || true)" -eq 3; then break; fi
            sleep 0.02
          done
          timeout 3s build/live/the status of false-restart >build/live/restart-status.txt
          awk '
            $1 == "state" && $2 == "FAILED" { state = 1 }
            $1 == "pid" && $2 == 0 { pid = 1 }
            $1 == "pidfd" && $2 == -1 { pidfd = 1 }
            $1 == "restarts" && $2 == 2 { restarts = 1 }
            $1 == "last-exit" && $2 == 1 { last = 1 }
            END { exit !(state && pid && pidfd && restarts && last) }
          ' build/live/restart-status.txt
          timeout 3s build/live/theseus daemon-stop
          wait "$daemon_pid"
          test "$(grep -c '^daemon-spawn' build/live/restart.log)" -eq 3
          test "$(grep -c '^daemon-exit' build/live/restart.log)" -eq 3
          test ! -e "$THESEUS_SOCKET"
          trap - EXIT

      - name: Wait for the owned socket and classify readiness failures
        run: |
          set -eux
          job_dir="$(mktemp -d "$RUNNER_TEMP/tsr.XXXXXXXX")"
          export THESEUS_SOCKET="$job_dir/control.sock"
          export THESEUS_RECORDS="$job_dir/services.tsc"
          cue export ./tests/socket_readiness.cue -e readinessRecords --out text \
            -t "testDir=$job_dir" -t "testProgram=$PWD/build/live/control-test" > "$THESEUS_RECORDS"
          cmp "$THESEUS_RECORDS" <(cue export ./tests/socket_readiness.cue -e readinessRecords --out text \
            -t "testDir=$job_dir" -t "testProgram=$PWD/build/live/control-test")

          daemon_pid=
          foreign_pid=
          cleanup() {
            for pid in "$daemon_pid" "$foreign_pid"; do
              if test -n "$pid"; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          wait_state() {
            for i in $(seq 1 150); do
              if test -S "$THESEUS_SOCKET" &&
                 test "$(timeout 2s build/live/the state of "$1")" = "$2"; then return 0; fi
              sleep 0.02
            done
            return 1
          }

          stop_daemon() {
            timeout 3s build/live/theseus daemon-stop
            wait "$daemon_pid"
            daemon_pid=
            test ! -e "$THESEUS_SOCKET"
          }

          build/live/theseusd socket-ready >build/live/ready.log 2>&1 &
          daemon_pid=$!
          wait_state socket-ready STARTING
          test ! -e "$job_dir/service.sock"
          touch "$job_dir/gate"
          wait_state socket-ready RUNNING
          grep -Fx "$(printf 'TE1\treadiness\tsocket-ready\t1\tready')" build/live/ready.log
          stop_daemon
          rm "$job_dir/service.sock"

          build/live/control-test listen "$job_dir/service.sock" &
          foreign_pid=$!
          for i in $(seq 1 100); do
            if test -S "$job_dir/service.sock"; then break; fi
            sleep 0.02
          done
          test -S "$job_dir/service.sock"
          build/live/theseusd socket-timeout >build/live/ready-timeout.log 2>&1 &
          daemon_pid=$!
          wait_state socket-timeout STOPPING
          test -f "$job_dir/child-started"
          wait_state socket-timeout FAILED
          test "$(grep -c '^daemon-exit' build/live/ready-timeout.log)" -eq 2
          grep -Fx "$(printf 'TE1\treadiness\tsocket-timeout\t2\ttimeout')" build/live/ready-timeout.log
          ! grep -E '[[:space:]]ready$' build/live/ready-timeout.log
          kill -0 "$foreign_pid"
          stop_daemon

          build/live/theseusd socket-early-exit >build/live/early-exit.log 2>&1 &
          daemon_pid=$!
          wait_state socket-early-exit FAILED
          grep -Fx "$(printf 'TE1\treadiness\tsocket-early-exit\t1\texited-before-ready')" build/live/early-exit.log
          stop_daemon

          kill "$foreign_pid"
          wait "$foreign_pid" || true
          foreign_pid=
          test -S "$job_dir/service.sock"
          rm "$job_dir/service.sock" "$job_dir/services.tsc" "$job_dir/gate" "$job_dir/child-started"
          rmdir "$job_dir"
          trap - EXIT
