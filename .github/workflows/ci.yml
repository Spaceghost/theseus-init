name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cue-and-nelua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.17.1

      - name: Validate and compile CUE service model
        run: |
          set -eux
          cue version
          cue vet ./...
          mkdir -p build
          cue export ./services/postgresql.cue -e compiled --out text > build/services.tsc
          cue export ./tests/services.cue -e compiled --out text >> build/services.tsc
          test "$(cut -f1 build/services.tsc | sort -u)" = TSC2
          test "$(wc -l < build/services.tsc)" -eq 4

      - name: Build pinned Nelua compiler
        run: |
          set -eux
          rm -rf /tmp/nelua-lang
          git init /tmp/nelua-lang
          git -C /tmp/nelua-lang remote add origin https://github.com/edubart/nelua-lang.git
          git -C /tmp/nelua-lang fetch --depth 1 origin 9ccf28de898a5e1615f1b04f5f28b3447aea0fb8
          git -C /tmp/nelua-lang checkout --detach FETCH_HEAD
          test "$(git -C /tmp/nelua-lang rev-parse HEAD)" = 9ccf28de898a5e1615f1b04f5f28b3447aea0fb8
          make -C /tmp/nelua-lang -j2
          /tmp/nelua-lang/nelua -h >/dev/null

      - name: Compile Theseus one-shot supervisor
        run: |
          set -eux
          /tmp/nelua-lang/nelua --compile-binary --release -o build/theseus src/theseus.nelua
          test -x build/theseus

      - name: Run core and grammar contracts
        run: |
          set -eux
          build/theseus --selftest
          ln -sf theseus build/the
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus status postgresql | tee build/status.txt
          grep -F 'PLANNED' build/status.txt
          grep -F 'unix-socket' build/status.txt
          build/the status of postgresql | grep -F 'PLANNED'
          test "$(build/the state of postgresql)" = PLANNED
          test "$(build/the restart-policy of postgresql)" = on-failure
          build/the services | grep -F 'postgresql'
          build/the failed services | grep -F '(none)'

      - name: Refuse unsupported readiness before effects
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          if build/theseus run postgresql >build/postgresql-run.txt 2>&1; then
            echo 'postgresql unexpectedly spawned' >&2
            exit 1
          else
            rc=$?
          fi
          test "$rc" -eq 69
          grep -F 'refusing to spawn it' build/postgresql-run.txt
          ! grep -E '^spawn[[:space:]]+postgresql[[:space:]]' build/postgresql-run.txt

      - name: Supervise successful child with pidfd identity
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus run true-once | tee build/true-once.txt
          grep -E '^spawn[[:space:]]+true-once[[:space:]]+pid[[:space:]]+[0-9]+[[:space:]]+pidfd[[:space:]]+[0-9]+[[:space:]]+attempt[[:space:]]+1$' build/true-once.txt
          grep -E '^result[[:space:]]+true-once[[:space:]]+STOPPED[[:space:]]+attempts[[:space:]]+1[[:space:]]+restarts[[:space:]]+0[[:space:]]+exit[[:space:]]+0[[:space:]]+signal[[:space:]]+0$' build/true-once.txt

      - name: Apply bounded on-failure restart policy
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          if build/theseus run false-restart >build/false-restart.txt 2>&1; then
            echo 'false-restart unexpectedly succeeded' >&2
            exit 1
          else
            rc=$?
          fi
          test "$rc" -eq 1
          test "$(grep -Ec '^spawn[[:space:]]+false-restart[[:space:]]' build/false-restart.txt)" -eq 3
          test "$(grep -Ec '^restart[[:space:]]+false-restart[[:space:]]' build/false-restart.txt)" -eq 2
          grep -E '^result[[:space:]]+false-restart[[:space:]]+FAILED[[:space:]]+attempts[[:space:]]+3[[:space:]]+restarts[[:space:]]+2[[:space:]]+exit[[:space:]]+1[[:space:]]+signal[[:space:]]+0$' build/false-restart.txt

      - name: Stop a live child through its pidfd
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          build/theseus run sleep-stop --stop-after-ms 25 | tee build/sleep-stop.txt
          grep -E '^transition[[:space:]]+sleep-stop[[:space:]]+STARTING[[:space:]]+READY$' build/sleep-stop.txt
          grep -E '^transition[[:space:]]+sleep-stop[[:space:]]+READY[[:space:]]+RUNNING$' build/sleep-stop.txt
          grep -E '^signal[[:space:]]+sleep-stop[[:space:]]+pidfd[[:space:]]+[0-9]+[[:space:]]+signal[[:space:]]+15$' build/sleep-stop.txt
          grep -E '^result[[:space:]]+sleep-stop[[:space:]]+STOPPED[[:space:]]+attempts[[:space:]]+1[[:space:]]+restarts[[:space:]]+0[[:space:]]+exit[[:space:]]+-1[[:space:]]+signal[[:space:]]+15$' build/sleep-stop.txt

      - name: Compile long-lived supervisor and live clients
        run: |
          set -eux
          mkdir -p build/live
          /tmp/nelua-lang/nelua --compile-binary --release -o build/live/theseusd src/supervisor.nelua
          /tmp/nelua-lang/nelua --compile-binary --release -o build/live/theseus src/live_client.nelua
          ln -sf theseus build/live/the
          test -x build/live/theseusd
          test -x build/live/theseus

      - name: Query live state and shut down without orphans
        run: |
          set -eux
          export THESEUS_RECORDS="$PWD/build/services.tsc"
          export THESEUS_SOCKET="$RUNNER_TEMP/theseus-$GITHUB_RUN_ID.sock"
          test ! -e "$THESEUS_SOCKET"
          build/live/theseusd sleep-stop >build/live/daemon.log 2>&1 &
          daemon_pid=$!
          cleanup() {
            if test -S "$THESEUS_SOCKET"; then
              build/live/theseus daemon-stop >/dev/null 2>&1 || true
            fi
            kill "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
            rm -f "$THESEUS_SOCKET"
          }
          trap cleanup EXIT
          i=0
          while ! test -S "$THESEUS_SOCKET"; do
            i=$((i + 1))
            test "$i" -lt 100
            sleep 0.02
          done
          test "$(stat -c '%a' "$THESEUS_SOCKET")" = 600
          if ! build/live/the status of sleep-stop | tee build/live/status.txt; then
            cat build/live/daemon.log >&2
            exit 1
          fi
          grep -F 'RUNNING' build/live/status.txt
          child_pid=$(awk '$1 == "pid" {print $2}' build/live/status.txt)
          test -n "$child_pid"
          kill -0 "$child_pid"
          test "$(build/live/the state of sleep-stop)" = RUNNING
          build/live/theseus daemon-stop
          wait "$daemon_pid"
          test ! -e "$THESEUS_SOCKET"
          if kill -0 "$child_pid" 2>/dev/null; then
            echo "owned child remained after daemon shutdown: $child_pid" >&2
            exit 1
          fi
          grep -E '^daemon-stopped[[:space:]]+sleep-stop$' build/live/daemon.log
          trap - EXIT
